<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="t d">
  <title id="t">Bimasha Zaman, AI Engineer and Full Stack Developer</title>
  <desc id="d">I take AI features from demo to production. Agents, RAG and LLM integrations, backed by ten years of full stack product work. Currently senior engineer at Life Coach Hub in the United States, end to end engineering on Bizam, and founder of Keeprate, AI for Shopify merchants. Based in Dhaka, Bangladesh, working across US, EU and Asia time zones. Open to select projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1014"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="30" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity=".11"/>
      <stop offset=".5" stop-color="#C7D2FE" stop-opacity=".035"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".66" stop-color="#FFFFFF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".055"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.05" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="fade" cx="980" cy="120" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".40"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="m">
      <rect width="1200" height="456" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1200" height="456" rx="20"/>
    </clipPath>
    <style>
      .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ring{transform-origin:867px 417px;animation:pulse 2.8s ease-out infinite}
      @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.9);opacity:0}}
      @media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="456" fill="url(#bg)"/>
    <rect width="1200" height="456" fill="url(#glow)"/>
    <rect width="1200" height="456" fill="url(#dots)" mask="url(#m)"/>
    <rect y="0" width="1200" height="1" fill="url(#edge)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="455" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>

  <!-- Identity -->
  <text xml:space="preserve" x="80" y="104" class="mono" font-size="16" letter-spacing="3.2" fill="#9097A1">AI ENGINEER  /  FULL STACK DEVELOPER</text>
  <text x="75" y="190" class="sans" font-size="78" font-weight="600" letter-spacing="-2.4" fill="#F4F4F5">Bimasha Zaman</text>
  <text x="80" y="250" class="sans" font-size="34" font-weight="400" letter-spacing="-.5"><tspan fill="#9EA3AB">I take AI features from demo </tspan><tspan fill="#F4F4F5" font-weight="500">to production.</tspan></text>
  <text x="80" y="296" class="sans" font-size="20" fill="#8A9099">Agents, RAG and LLM integrations, backed by</text>
  <text x="80" y="326" class="sans" font-size="20" fill="#8A9099">ten years of full stack product work.</text>

  <!-- Now panel -->
  <rect x="790" y="72" width="330" height="268" rx="14" fill="#0B0C0F" fill-opacity=".72"/>
  <rect x="790" y="72" width="330" height="268" rx="14" fill="url(#panel)"/>
  <rect x="790.5" y="72.5" width="329" height="267" rx="13.5" fill="none" stroke="url(#panelEdge)"/>
  <text x="822" y="110" class="mono" font-size="13" letter-spacing="2.6" fill="#8B9099">CURRENTLY</text>

  <text x="822" y="152" class="sans" font-size="20" font-weight="600" letter-spacing="-.2" fill="#F4F4F5">Life Coach Hub</text>
  <text x="822" y="177" class="sans" font-size="16" fill="#8F949C">Senior engineer · United States</text>
  <rect x="822" y="196" width="266" height="1" fill="#FFFFFF" fill-opacity=".08"/>

  <text x="822" y="226" class="sans" font-size="20" font-weight="600" letter-spacing="-.2" fill="#F4F4F5">Bizam</text>
  <text x="822" y="251" class="sans" font-size="16" fill="#8F949C">End to end engineering · live</text>
  <rect x="822" y="270" width="266" height="1" fill="#FFFFFF" fill-opacity=".08"/>

  <text x="822" y="300" class="sans" font-size="20" font-weight="600" letter-spacing="-.2" fill="#F4F4F5">Keeprate</text>
  <text x="822" y="325" class="sans" font-size="16" fill="#8F949C">Founder · AI for Shopify merchants</text>

  <!-- Footer strip -->
  <rect x="80" y="382" width="1040" height="1" fill="#FFFFFF" fill-opacity=".08"/>
  <text xml:space="preserve" x="80" y="422" class="mono" font-size="14" letter-spacing="2" fill="#737881" textLength="487" lengthAdjust="spacing">DHAKA, BANGLADESH  ·  US, EU AND ASIA TIME ZONES</text>
  <circle class="ring" cx="867" cy="417" r="4" fill="#4ADE80"/>
  <circle cx="867" cy="417" r="4" fill="#4ADE80"/>
  <text x="883" y="422" class="mono" font-size="14" letter-spacing="2" fill="#A1A6AE" textLength="237" lengthAdjust="spacing">OPEN TO SELECT PROJECTS</text>
</svg>
